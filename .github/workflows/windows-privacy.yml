name: Windows filesystem acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun scripts/release/workspace-install-smoke.mjs
      - run: bun packages/private-filesystem/smoke/native-permissions.ts
        if: ${{ !cancelled() }}
