name: Windows acceptance
on:
  workflow_dispatch:
    inputs:
      student_only:
        description: Skip teacher setup when diagnosing the installed student
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  privacy:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - if: matrix.runner != 'windows-11-arm'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install native Windows ARM64 Bun from verified pinned release asset
        if: matrix.runner == 'windows-11-arm'
        run: |
          $base = 'https://github.com/oven-sh/bun/releases/download/bun-v1.4.2'
          $archive = Join-Path $env:RUNNER_TEMP 'bun-windows-aarch64.zip'
          $checksums = Join-Path $env:RUNNER_TEMP 'bun-checksums.txt'
          Invoke-WebRequest "$base/bun-windows-aarch64.zip" -OutFile $archive
          Invoke-WebRequest "$base/SHASUMS256.txt" -OutFile $checksums
          $line = Get-Content $checksums | Where-Object { $_ -match '\s+bun-windows-aarch64\.zip$' }
          if (@($line).Count -ne 1) { throw 'Missing unambiguous native runtime checksum' }
          $expected = ($line -split '\s+')[0]
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected.ToLowerInvariant()) { throw 'Runtime checksum mismatch' }
          Expand-Archive $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'native-bun')
          (Join-Path $env:RUNNER_TEMP 'native-bun/bun-windows-aarch64') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun scripts/release/workspace-install-smoke.mjs
      - run: bun packages/private-filesystem/smoke/native-permissions.ts
        if: ${{ !cancelled() }}

      - name: Check native durable checkpoint storage
        if: ${{ !cancelled() }}
        run: bun scripts/release/checkpoint-smoke.mjs

      - name: Compile disposable native acceptance programs
        id: programs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports/windows-smoke | Out-Null
          bun run --cwd apps/dashboard build
          if ($LASTEXITCODE -ne 0) { throw 'Dashboard build failed' }
          Copy-Item apps/dashboard/dist reports/windows-smoke/dashboard -Recurse
          $entries = @{
            'marea-admin' = 'apps/teacher-server/cli-entry.ts'
            'marea-teacher' = 'apps/teacher-server/teacher-host-entry.ts'
            'marea-operations' = 'apps/teacher-server/operations-entry.ts'
            'marea-install' = 'scripts/release/install.mjs'
            'marea' = 'apps/student/src/marea-entry.boundary.ts'
            'tui-smoke' = 'packages/student-tui/scripts/entry.ts'
          }
          foreach ($entry in $entries.GetEnumerator()) {
            bun build $entry.Value --compile --outfile "reports/windows-smoke/$($entry.Key).exe"
            if ($LASTEXITCODE -ne 0) { throw "Native compile failed: $($entry.Key)" }
          }
          '{"component":"server","version":"0.1.0-preview.1"}' | Set-Content reports/windows-smoke/manifest.json
      - name: Exercise native terminal
        if: ${{ !cancelled() && steps.programs.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/release/conpty-smoke.ps1 -Executable (Resolve-Path reports/windows-smoke/marea.exe) -TuiExecutable (Resolve-Path reports/windows-smoke/tui-smoke.exe)
      - name: Exercise distributed student journey
        if: ${{ !cancelled() && steps.programs.outcome == 'success' }}
        run: bun scripts/release/installed-client-smoke.mjs reports/windows-smoke/marea.exe reports/windows-smoke/client-receipt.json
      - name: Exercise managed launcher
        if: ${{ !cancelled() && steps.programs.outcome == 'success' }}
        run: bun scripts/release/preview-launcher-smoke.mjs reports/windows-smoke
      - name: Exercise fresh server setup and recovery
        if: ${{ !cancelled() && steps.programs.outcome == 'success' && matrix.runner == 'windows-2025' && !inputs.student_only }}
        run: bun scripts/release/preview-setup-smoke.mjs reports/windows-smoke
