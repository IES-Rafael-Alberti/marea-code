name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Verify Bun version
        run: test "$(bun --version)" = "1.4.0"

      - name: Install dependencies
        # Lifecycle scripts from dependencies are not needed by the quality gates.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run quality gates
        run: bun run quality:checks

      - name: Audit dependencies and verify local mitigation
        run: bun run release:audit

  mutation:
    name: Mutation (${{ matrix.workspace }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - .
          - apps/dashboard
          - apps/student
          - apps/teacher-server
          - packages/deepagents-adapter
          - packages/i18n
          - packages/plugin-api
          - packages/protocol
          - packages/private-filesystem
          - packages/sqlite-storage
          - packages/student-tui
          - packages/telemetry-pipeline
          - packages/transport-server
          - packages/workspace-backend
          - plugins/identity/google-workspace
          - plugins/inference/openrouter
          - plugins/telemetry/langfuse
          - plugins/telemetry/otlp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Run the complete workspace mutation gate
        working-directory: ${{ matrix.workspace }}
        env:
          WORKSPACE: ${{ matrix.workspace }}
        run: |
          if [ "$WORKSPACE" = '.' ]; then
            bun run mutation:root
          else
            bun run mutation
          fi
