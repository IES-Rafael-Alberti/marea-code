name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Verify Bun version
        run: test "$(bun --version)" = "1.4.2"

      - name: Install dependencies
        # Lifecycle scripts from dependencies are not needed by the quality gates.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run quality gates
        run: bun run quality:checks

      - name: Audit dependencies and verify local mitigation
        run: bun run release:audit

  mutation:
    name: Mutation (${{ matrix.workspace }}, ${{ matrix.partition || 'all' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - .
          - packages/deepagents-adapter
          - packages/i18n
          - packages/plugin-api
          - packages/protocol
          - packages/private-filesystem
          - packages/sqlite-storage
          - packages/student-tui
          - packages/telemetry-pipeline
          - packages/transport-server
          - packages/workspace-backend
          - plugins/identity/google-workspace
          - plugins/inference/openrouter
          - plugins/telemetry/langfuse
          - plugins/telemetry/otlp
        include:
          - workspace: apps/dashboard
            partition: governance
            mutate: src/modules/governance/**/*.ts,src/modules/governance/**/*.tsx,src/profiles/**/*.ts,src/profiles/**/*.tsx,!src/**/*.spec.ts,!src/**/*.test.ts,!src/**/*.fixture.ts,!src/**/*.spec.tsx,!src/**/*.test.tsx
          - workspace: apps/dashboard
            partition: authoring
            mutate: src/modules/skill-authoring/**/*.ts,src/modules/skill-authoring/**/*.tsx,src/modules/teaching/**/*.ts,src/modules/teaching/**/*.tsx,!src/**/*.spec.ts,!src/**/*.test.ts,!src/**/*.fixture.ts,!src/**/*.spec.tsx,!src/**/*.test.tsx
          - workspace: apps/dashboard
            partition: classroom
            mutate: src/modules/sessions/**/*.ts,src/modules/sessions/**/*.tsx,src/modules/session/**/*.ts,src/modules/session/**/*.tsx,src/modules/educational-insights/**/*.ts,src/modules/educational-insights/**/*.tsx,src/modules/evaluation/**/*.ts,src/modules/evaluation/**/*.tsx,!src/**/*.spec.ts,!src/**/*.test.ts,!src/**/*.fixture.ts,!src/**/*.spec.tsx,!src/**/*.test.tsx
          - workspace: apps/dashboard
            partition: shell
            mutate: src/**/*.ts,src/**/*.tsx,!src/modules/governance/**,!src/profiles/**,!src/modules/skill-authoring/**,!src/modules/teaching/**,!src/modules/sessions/**,!src/modules/session/**,!src/modules/educational-insights/**,!src/modules/evaluation/**,!src/**/*.spec.ts,!src/**/*.test.ts,!src/**/*.fixture.ts,!src/**/*.spec.tsx,!src/**/*.test.tsx
          - workspace: apps/student
            partition: boundaries
            mutate: src/**/*.boundary.ts,!src/**/*.spec.ts,!src/**/*.test.ts,!src/**/*.fixture.ts
          - workspace: apps/student
            partition: session
            mutate: src/**/*.ts,!src/**/*.boundary.ts,!src/**/*.spec.ts,!src/**/*.test.ts,!src/**/*.fixture.ts
          - workspace: apps/teacher-server
            partition: host
            mutate: src/platform/teacher-host/**/*.ts,!src/**/*.spec.ts,!src/**/*.test.ts,!src/**/*.fixture.ts
          - workspace: apps/teacher-server
            partition: operations
            mutate: src/platform/operations*/**/*.ts,!src/**/*.spec.ts,!src/**/*.test.ts,!src/**/*.fixture.ts
          - workspace: apps/teacher-server
            partition: persistence
            mutate: src/platform/persistence/**/*.ts,!src/**/*.spec.ts,!src/**/*.test.ts,!src/**/*.fixture.ts
          - workspace: apps/teacher-server
            partition: platform
            mutate: src/platform/**/*.ts,!src/platform/teacher-host/**,!src/platform/operations*/**,!src/platform/persistence/**,!src/platform/operator*/**,!src/platform/recovery/**,!src/**/*.spec.ts,!src/**/*.test.ts,!src/**/*.fixture.ts
          - workspace: apps/teacher-server
            partition: operator
            mutate: src/platform/operator*/**/*.ts,!src/**/*.spec.ts,!src/**/*.test.ts,!src/**/*.fixture.ts
          - workspace: apps/teacher-server
            partition: recovery
            mutate: src/platform/recovery/**/*.ts,!src/**/*.spec.ts,!src/**/*.test.ts,!src/**/*.fixture.ts
          - workspace: apps/teacher-server
            partition: teaching
            mutate: src/teaching/**/*.ts,!src/**/*.spec.ts,!src/**/*.test.ts,!src/**/*.fixture.ts
          - workspace: apps/teacher-server
            partition: education
            mutate: src/educational-insights/**/*.ts,src/evaluation/**/*.ts,src/dashboard-profiles/**/*.ts,!src/**/*.spec.ts,!src/**/*.test.ts,!src/**/*.fixture.ts
          - workspace: apps/teacher-server
            partition: http
            mutate: src/product-http/**/*.ts,src/model-gateway/**/*.ts,!src/**/*.spec.ts,!src/**/*.test.ts,!src/**/*.fixture.ts
          - workspace: apps/teacher-server
            partition: domain
            mutate: src/**/*.ts,!src/platform/**,!src/teaching/**,!src/educational-insights/**,!src/evaluation/**,!src/dashboard-profiles/**,!src/product-http/**,!src/model-gateway/**,!src/**/*.spec.ts,!src/**/*.test.ts,!src/**/*.fixture.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Run the complete workspace mutation gate
        working-directory: ${{ matrix.workspace }}
        env:
          WORKSPACE: ${{ matrix.workspace }}
          MUTATE: ${{ matrix.mutate }}
        run: |
          if [ "$WORKSPACE" = '.' ]; then
            bun run mutation:root
          elif [ -n "$MUTATE" ]; then
            bun run mutation --mutate "$MUTATE"
          else
            bun run mutation
          fi
