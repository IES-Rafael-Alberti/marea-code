name: Native preview releases
on:
  workflow_dispatch:
    inputs:
      version:
        description: Explicit preview version (for example 0.1.0-preview.1)
        type: string
        required: true
      publish:
        description: Publish a tested preview (otherwise keep review artifacts only)
        type: boolean
        default: false
      native_only:
        description: Build native review artifacts only (publishing still requires all quality gates)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: native-preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    if: inputs.publish || !inputs.native_only
    uses: ./.github/workflows/quality.yml
  native:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            component: student
          - runner: ubuntu-24.04
            arch: x64
            component: server
          - runner: ubuntu-24.04-arm
            arch: arm64
            component: student
          - runner: macos-14
            arch: arm64
            component: student
          - runner: macos-14
            arch: arm64
            component: server
          - runner: windows-2025
            arch: x64
            component: student
          - runner: windows-2025
            arch: x64
            component: server
          - runner: windows-11-arm
            arch: arm64
            component: student
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: pwsh
    env:
      CANDIDATE_VERSION: ${{ inputs.version }}
      COMPONENT: ${{ matrix.component }}
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the native Node acceptance harness
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.1
          architecture: ${{ matrix.arch }}
      - name: Assert acceptance prerequisites
        run: |
          if ((node --version) -ne 'v22.23.1') { throw 'Wrong acceptance Node version' }
          if ((node -p 'process.arch') -ne $env:EXPECTED_ARCH) { throw 'Acceptance Node must be native' }
          node -e 'const {DatabaseSync}=require("node:sqlite"); const db=new DatabaseSync(":memory:",{readBigInts:true}); if(db.prepare("SELECT 1 AS value").get().value!==1n)process.exit(1); db.close()'
          if ($LASTEXITCODE -ne 0) { throw 'Native node:sqlite is unavailable' }
          git --version
          if ($LASTEXITCODE -ne 0) { throw 'Git is required for the disposable project' }
      - if: matrix.runner != 'windows-11-arm'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install native Windows ARM64 Bun from verified pinned release asset
        if: matrix.runner == 'windows-11-arm'
        run: |
          $base = 'https://github.com/oven-sh/bun/releases/download/bun-v1.4.0'
          $archive = Join-Path $env:RUNNER_TEMP 'bun-windows-aarch64.zip'
          $checksums = Join-Path $env:RUNNER_TEMP 'bun-checksums.txt'
          Invoke-WebRequest "$base/bun-windows-aarch64.zip" -OutFile $archive
          Invoke-WebRequest "$base/SHASUMS256.txt" -OutFile $checksums
          $line = Get-Content $checksums | Where-Object { $_ -match '\s+bun-windows-aarch64\.zip$' }
          if (@($line).Count -ne 1) { throw 'Missing unambiguous native runtime checksum' }
          $expected = ($line -split '\s+')[0]
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected.ToLowerInvariant()) { throw 'Runtime checksum mismatch' }
          Expand-Archive $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'native-bun')
          (Join-Path $env:RUNNER_TEMP 'native-bun/bun-windows-aarch64') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Require selected immutable tag and clean source
        run: |
          if ($env:GITHUB_REF -ne "refs/tags/v$env:CANDIDATE_VERSION") { throw 'Version must match the selected tag' }
          if ((git status --porcelain).Length -ne 0) { throw 'Signed candidates require a clean checkout' }
      - name: Assert pinned native runtime
        run: |
          if ((bun --version) -ne '1.4.0') { throw 'Wrong Bun version' }
          if ((bun -e 'console.log(process.arch)') -ne $env:EXPECTED_ARCH) { throw 'Emulated runtime is not native validation' }
          bun install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
      - name: Focused integrity and native privacy tests
        run: |
          bun run test -- scripts/release/manifest.test.ts scripts/release/signature.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Release tests failed' }
          bun packages/private-filesystem/smoke/native-permissions.ts
          if ($LASTEXITCODE -ne 0) { throw 'Native privacy probe failed' }
      - name: Set up pinned native Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: false
      - name: Build pinned inventory and signature tools through Go checksum database
        env:
          CGO_ENABLED: "0"
        run: |
          go install github.com/anchore/syft/cmd/syft@v1.33.0
          if ($LASTEXITCODE -ne 0) { throw 'Syft build failed' }
          go install github.com/sigstore/cosign/v3/cmd/cosign@v3.0.2
          if ($LASTEXITCODE -ne 0) { throw 'Cosign build failed' }
          (Join-Path (go env GOPATH) 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build reviewable native candidate
        run: |
          New-Item -ItemType Directory -Force reports/phase5/candidates | Out-Null
          bun scripts/release/build.mjs $env:CANDIDATE_VERSION $env:COMPONENT reports/phase5/candidates
          if ($LASTEXITCODE -ne 0) { throw 'Candidate build failed' }
      - name: Native student credential create and replacement privacy
        if: matrix.component == 'student'
        run: |
          bun scripts/release/native-credential-writer.fixture.ts reports/phase5/native-credential-writer-receipt.json
          if ($LASTEXITCODE -ne 0) { throw 'Native credential replacement/privacy failed' }
      - name: Windows native ConPTY smoke
        if: runner.os == 'Windows' && matrix.component == 'student'
        run: |
          $exe = Get-ChildItem reports/phase5/candidates -Recurse -Filter marea.exe | Select-Object -First 1
          $tui = Join-Path $env:RUNNER_TEMP 'marea-opentui-smoke.exe'
          bun build packages/student-tui/scripts/entry.ts --compile --outfile $tui
          if ($LASTEXITCODE -ne 0) { throw 'Native OpenTUI fixture compile failed' }
          ./scripts/release/conpty-smoke.ps1 -Executable $exe.FullName -TuiExecutable $tui
      - name: POSIX native OpenTUI terminal smoke
        if: runner.os != 'Windows' && matrix.component == 'student'
        run: |
          $tui = Join-Path $env:RUNNER_TEMP 'marea-opentui-smoke'
          bun build packages/student-tui/scripts/entry.ts --compile --outfile $tui
          if ($LASTEXITCODE -ne 0) { throw 'Native OpenTUI fixture compile failed' }
          bun scripts/release/posix-pty-smoke.mjs $tui
          if ($LASTEXITCODE -ne 0) { throw 'Native OpenTUI terminal lifecycle failed' }
      - name: Include the pinned signature verifier in the signed inventory
        run: |
          $manifest = Get-ChildItem reports/phase5/candidates -Recurse -Filter manifest.json | Select-Object -First 1
          $cosign = (Get-Command cosign).Source
          syft "file:$cosign" -o "cyclonedx-json=$(Join-Path $manifest.DirectoryName 'cosign.sbom.cdx.json')"
          if ($LASTEXITCODE -ne 0) { throw 'Verifier inventory failed' }
          $license = Join-Path (go env GOMODCACHE) 'github.com/sigstore/cosign/v3@v3.0.2/LICENSE'
          bun scripts/release/preview-publish.mjs include-tool $manifest.DirectoryName $cosign $license
          if ($LASTEXITCODE -ne 0) { throw 'Signature tool packaging failed' }
      - name: Sign candidate inventory and standalone installer; verify exact workflow identity
        run: |
          $identity = "https://github.com/$env:GITHUB_REPOSITORY/.github/workflows/native-release-candidate.yml@$env:GITHUB_REF"
          $manifest = Get-ChildItem reports/phase5/candidates -Recurse -Filter manifest.json | Select-Object -First 1
          $bundle = Join-Path $manifest.DirectoryName 'manifest.sigstore.json'
          cosign sign-blob --yes --bundle $bundle $manifest.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Manifest signing failed' }
          cosign verify-blob --bundle $bundle --certificate-identity $identity --certificate-oidc-issuer https://token.actions.githubusercontent.com $manifest.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Manifest verification failed' }
          $installer = Get-ChildItem $manifest.DirectoryName -Filter 'marea-install*' | Select-Object -First 1
          cosign sign-blob --yes --bundle "$($installer.FullName).sigstore.json" $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Installer signing failed' }
          # Installer signature is distributed separately: closed inventory excludes transport metadata.
          Move-Item "$($installer.FullName).sigstore.json" reports/phase5/installer.sigstore.json
      - name: Native install, update, uninstall and server recovery
        run: |
          $manifest = Get-ChildItem reports/phase5/candidates -Recurse -Filter manifest.json | Select-Object -First 1
          bun scripts/release/native-lifecycle.mjs $manifest.DirectoryName
          if ($LASTEXITCODE -ne 0) { throw 'Native lifecycle failed' }
      - name: Distributed client login, approval, checkpoint and reconnect
        if: matrix.component == 'student'
        run: |
          $name = if ($IsWindows) { 'marea.exe' } else { 'marea' }
          $executables = @(Get-ChildItem reports/phase5/candidates -Recurse -Filter $name)
          if ($executables.Count -ne 1) { throw 'Expected one compiled student artifact' }
          bun scripts/release/installed-client-smoke.mjs $executables[0].FullName reports/phase5/installed-client-receipt.json
          if ($LASTEXITCODE -ne 0) { throw 'Distributed student journey failed' }
      - name: Native managed launcher
        run: |
          $manifest = Get-ChildItem reports/phase5/candidates -Recurse -Filter manifest.json | Select-Object -First 1
          bun scripts/release/preview-launcher-smoke.mjs $manifest.DirectoryName
          if ($LASTEXITCODE -ne 0) { throw 'Managed launcher acceptance failed' }
      - name: Fresh managed server setup and update recovery
        if: matrix.component == 'server'
        run: |
          $manifest = Get-ChildItem reports/phase5/candidates -Recurse -Filter manifest.json | Select-Object -First 1
          bun scripts/release/preview-setup-smoke.mjs $manifest.DirectoryName
          if ($LASTEXITCODE -ne 0) { throw 'Managed server acceptance failed' }
      - name: Retain tested native candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-${{ matrix.runner }}-${{ matrix.component }}
          path: |
            reports/phase5/candidates
            reports/phase5/installer.sigstore.json
            reports/phase5/installed-client-receipt.json
            reports/phase5/native-credential-writer-receipt.json
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [quality, native]
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PREVIEW_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: candidate-*
          path: reports/native-candidates
      - name: Prepare complete publication
        run: bun scripts/release/preview-publish.mjs prepare reports/native-candidates reports/publication "$GITHUB_REPOSITORY" "$PREVIEW_VERSION"
      - name: Publish only after every asset has uploaded
        run: |
          test "$GITHUB_REF" = "refs/tags/v$PREVIEW_VERSION"
          gh release create "v$PREVIEW_VERSION" --verify-tag --draft --prerelease --title "Marea $PREVIEW_VERSION" --notes-file DISTRIBUTION.md
          find reports/publication -type f -print0 | xargs -0 -n 20 gh release upload "v$PREVIEW_VERSION"
          gh release edit "v$PREVIEW_VERSION" --draft=false --prerelease --latest=false
