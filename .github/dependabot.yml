version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    # Freeze routine version PRs during the classroom pilot; security PRs are unaffected.
    open-pull-requests-limit: 0
    labels:
      - dependencies
    # Upgrade coupled tools (for example Vitest and its coverage provider) together.
    groups:
      compatible-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Freeze routine version PRs during the classroom pilot; security PRs are unaffected.
    open-pull-requests-limit: 0
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
